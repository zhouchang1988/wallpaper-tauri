<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云海日出 — Sea of Clouds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1c1c28; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- 覆盖层 UI ---------- */
  .ui {
    position: fixed; z-index: 10; pointer-events: none;
    color: #d8dce8; font-family: "Georgia", "Songti SC", serif;
    text-shadow: 0 2px 8px rgba(16,16,32,.8);
    user-select: none;
  }
  #title { top: 28px; left: 32px; }
  #title h1 { font-size: 26px; letter-spacing: 6px; font-weight: normal; color: #f0e8e6; }
  #title p  { font-size: 12px; letter-spacing: 3px; opacity: .55; margin-top: 6px; }
  #hint {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; opacity: .5; text-align: center; line-height: 1.9;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(10,12,22,.50) 100%);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title" class="ui">
  <h1>云 海 日 出</h1>
  <p>SEA OF CLOUDS · ALPENGLOW</p>
</div>
<div id="hint" class="ui">大片云海、零星峰顶与浅粉金日出 · 原型页面</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ---------- 渲染器 / 场景 ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// 线性雾：近处清晰、远处剪影，避免指数雾把远山糊成一片
scene.fog = new THREE.Fog(0x6a6880, 90, 360);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1200);

// ---------- 天空穹顶（冷调底 + 浅粉金地平线，保留日出而不回到橙金） ----------
{
  const skyMat = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vPos;
      void main() {
        float h = normalize(vPos).y;
        vec3 hor = vec3(0.96, 0.78, 0.66);   // 浅粉金，不是南瓜橙
        vec3 mid = vec3(0.52, 0.52, 0.70);   // 薰衣草蓝
        vec3 top = vec3(0.10, 0.14, 0.32);   // 冷蓝天顶
        vec3 col = mix(hor, mid, smoothstep(0.0, 0.24, h));
        col = mix(col, top, smoothstep(0.18, 0.68, h));
        col = mix(vec3(0.12, 0.12, 0.20), col, smoothstep(-0.12, 0.02, h));
        gl_FragColor = vec4(col, 1.0);
      }`,
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 32, 20), skyMat));
}

// ---------- 太阳方向（略抬高，保证 45° 巡航时上半画幅能看到日盘） ----------
const SUN_DIR = new THREE.Vector3(0.50, 0.22, -0.76).normalize();

// ---------- 灯光（日出：强平行光打向阳坡，半球冷补光托住背阴面） ----------
scene.add(new THREE.HemisphereLight(0xb8c4dc, 0x3e4258, 1.45));
const sunLight = new THREE.DirectionalLight(0xffe4c8, 2.85);
sunLight.position.copy(SUN_DIR).multiplyScalar(100);
scene.add(sunLight);

// ---------- 太阳 + 光晕（径向渐变羽化，避免硬边同心圆） ----------
function radialSunTexture(stops) {
  const s = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = s;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  for (const [t, color] of stops) g.addColorStop(t, color);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

const sunGroup = new THREE.Group();
{
  const core = new THREE.Mesh(
    new THREE.PlaneGeometry(64, 64),
    new THREE.MeshBasicMaterial({
      map: radialSunTexture([
        [0.00, 'rgba(255,247,236,1)'],
        [0.32, 'rgba(255,240,220,0.95)'],
        [0.52, 'rgba(255,220,188,0.40)'],
        [0.72, 'rgba(255,210,180,0.0)'],
        [1.00, 'rgba(255,210,180,0.0)'],
      ]),
      transparent: true, depthWrite: false, fog: false,
    })
  );
  sunGroup.add(core);

  const halo = new THREE.Mesh(
    new THREE.PlaneGeometry(220, 220),
    new THREE.MeshBasicMaterial({
      map: radialSunTexture([
        [0.00, 'rgba(255,210,170,0.50)'],
        [0.18, 'rgba(255,190,150,0.22)'],
        [0.42, 'rgba(255,170,140,0.08)'],
        [1.00, 'rgba(255,160,130,0.0)'],
      ]),
      transparent: true, depthWrite: false, fog: false,
      blending: THREE.AdditiveBlending,
    })
  );
  halo.position.z = -0.5;
  sunGroup.add(halo);
}
sunGroup.position.copy(SUN_DIR).multiplyScalar(380);
scene.add(sunGroup);

// ---------- 简易 value noise（无外部依赖，地形用） ----------
function hash(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, octaves = 5) {
  let h = 0, amp = 0.5, f = 1, sum = 0;
  for (let i = 0; i < octaves; i++) {
    h += noise2(x * f, y * f) * amp;
    sum += amp;
    f *= 2.05;
    amp *= 0.5;
  }
  return h / sum;
}
function ridge(x, y) {
  return 1 - Math.abs(2 * noise2(x, y) - 1);
}
function ridgedFbm(x, y) {
  let h = 0, amp = 0.5, f = 1, sum = 0;
  for (let i = 0; i < 6; i++) {
    h += ridge(x * f, y * f) * amp;
    sum += amp;
    f *= 2.03;
    amp *= 0.48;
  }
  return h / sum;
}

// ---------- 写实群峰：高度错落——矮岭沉谷、中峰半掩、高岭露山腰 ----------
const SIZE = 240, SEG = 200;
const HEIGHT_SCALE = 40; // 高度图编码上限，供云层相交渐隐采样
const terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
terrainGeo.rotateX(-Math.PI / 2);
const heightPixels = new Uint8Array((SEG + 1) * (SEG + 1));
{
  const pos = terrainGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const wx = fbm(x * 0.012 + 8, z * 0.012 + 8, 3);
    const wz = fbm(x * 0.012 + 21, z * 0.012 + 21, 3);
    const ridges = ridgedFbm(x * 0.014 + wx * 1.6, z * 0.014 + wz * 1.6);
    const base = fbm(x * 0.006 + 3, z * 0.006 + 3, 4);
    // 大尺度体量：有的山岭高耸、有的只是矮脊，避免峰顶一刀齐
    const massif = fbm(x * 0.0044 + 11, z * 0.0044 + 11, 3);
    let n = ridges * 0.55 + base * 0.45;
    n = Math.max(0, (n - 0.22) / 0.78);
    const peakScale = 14 + massif * 20; // 约 14~34，拉开高低差
    let h = Math.pow(n, 1.32) * peakScale;
    if (h > 8) h += (noise2(x * 0.11, z * 0.11) - 0.5) * 0.55;
    pos.setY(i, h);
    heightPixels[i] = Math.min(255, Math.round((h / HEIGHT_SCALE) * 255));
  }
  pos.needsUpdate = true;
  terrainGeo.computeVertexNormals();

  const nrm = terrainGeo.attributes.normal;
  const colors = new Float32Array(pos.count * 3);
  const cShade = new THREE.Color(0x5c6680); // 背光冷蓝灰，避免死黑
  const cRock = new THREE.Color(0x9a948c);
  const cLit = new THREE.Color(0xf8d4b8);  // 向阳粉金
  const c = new THREE.Color();
  const nVec = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    const h = pos.getY(i);
    nVec.set(nrm.getX(i), nrm.getY(i), nrm.getZ(i));
    const ndl = nVec.dot(SUN_DIR);
    const wrap = THREE.MathUtils.clamp(ndl * 0.55 + 0.45, 0, 1);
    const sunK = Math.pow(Math.max(0, ndl), 0.55);
    c.copy(cShade);
    c.lerp(cRock, wrap);
    c.lerp(cLit, sunK * 0.88);
    // 峰顶向阳再叠一层 alpenglow；谷底略压暗但不拉成黑洞
    const peak = THREE.MathUtils.smoothstep(h, 8.0, 22.0);
    c.lerp(cLit, peak * sunK * 0.42);
    const valley = 1 - THREE.MathUtils.smoothstep(h, 3.0, 10.0);
    c.multiplyScalar(1 - valley * 0.22);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
const heightMap = new THREE.DataTexture(heightPixels, SEG + 1, SEG + 1, THREE.RedFormat);
heightMap.magFilter = THREE.LinearFilter;
heightMap.minFilter = THREE.LinearFilter;
heightMap.wrapS = THREE.ClampToEdgeWrapping;
heightMap.wrapT = THREE.ClampToEdgeWrapping;
heightMap.needsUpdate = true;

scene.add(new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, flatShading: false, roughness: 0.62, metalness: 0.0,
})));

// ---------- 云海（谷底成簇、山腰留洞；按地形高差渐隐） ----------
const cloudVert = `
  varying vec3 vWorld;
  void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorld = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const cloudFrag = `
  uniform float uTime;
  uniform vec2 uDrift;
  uniform vec3 uSunDir;
  uniform float uAlpha;
  uniform sampler2D uHeight;
  uniform float uSize;
  uniform float uLayerY;
  uniform float uHeightScale;
  uniform float uCoverLo;
  uniform float uCoverHi;
  varying vec3 vWorld;

  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash(i), b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm(vec2 p) {
    float v = 0.0, amp = 0.55;
    for (int i = 0; i < 4; i++) {
      v += noise(p) * amp;
      p *= 2.15;
      amp *= 0.5;
    }
    return v;
  }
  void main() {
    vec2 p = vWorld.xz * 0.011 + uDrift * uTime;
    float w = fbm(p * 1.6 + vec2(uTime * 0.01, 0.0));
    float n = fbm(p + w * 1.7);
    // 大尺度云团掩膜：成片的海 + 成片的洞，不是均匀地毯
    float banks = fbm(vWorld.xz * 0.0042 + uDrift * uTime * 0.25 + vec2(3.1, 7.7));
    float a = smoothstep(uCoverLo, uCoverHi, n) * smoothstep(0.24, 0.50, banks);
    a *= 1.0 - smoothstep(280.0, 380.0, length(vWorld.xz));

    // 山体靠近本层时渐隐，避免平面切山的硬边/锯齿
    vec2 huv = vWorld.xz / uSize + 0.5;
    float inside = step(0.0, huv.x) * step(huv.x, 1.0) * step(0.0, huv.y) * step(huv.y, 1.0);
    float terrainH = texture2D(uHeight, clamp(huv, 0.0, 1.0)).r * uHeightScale * inside;
    a *= smoothstep(0.5, 5.0, uLayerY - terrainH);

    float sunFace = clamp(dot(normalize(vWorld), normalize(uSunDir)) * 0.5 + 0.5, 0.0, 1.0);
    vec3 shade = vec3(0.62, 0.60, 0.70);
    vec3 lit = vec3(1.00, 0.90, 0.82); // 向阳面浅粉金
    vec3 col = mix(shade, lit, sunFace * (0.40 + 0.60 * n));

    gl_FragColor = vec4(col, a * uAlpha);
  }`;

const cloudMats = [];
// 三层：谷底较浓、山腰成带、峰顶之上只留薄纱
const CLOUD_LAYERS = [
  { y: 8.5,  drift: [0.006, 0.002], alpha: 0.88, size: 780, cover: [0.26, 0.54] },
  { y: 12.5, drift: [-0.004, 0.005], alpha: 0.58, size: 750, cover: [0.34, 0.62] },
  { y: 16.5, drift: [0.003, -0.006], alpha: 0.28, size: 720, cover: [0.42, 0.68] },
];
CLOUD_LAYERS.forEach((def, i) => {
  const mat = new THREE.ShaderMaterial({
    vertexShader: cloudVert,
    fragmentShader: cloudFrag,
    uniforms: {
      uTime: { value: 0 },
      uDrift: { value: new THREE.Vector2(...def.drift) },
      uSunDir: { value: SUN_DIR },
      uAlpha: { value: def.alpha },
      uHeight: { value: heightMap },
      uSize: { value: SIZE },
      uLayerY: { value: def.y },
      uHeightScale: { value: HEIGHT_SCALE },
      uCoverLo: { value: def.cover[0] },
      uCoverHi: { value: def.cover[1] },
    },
    transparent: true,
    depthWrite: false,
  });
  const layer = new THREE.Mesh(new THREE.PlaneGeometry(def.size, def.size), mat);
  layer.rotation.x = -Math.PI / 2;
  layer.position.y = def.y;
  layer.renderOrder = 10 + i;
  scene.add(layer);
  cloudMats.push(mat);
});

// ---------- 动画 ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 45° 巡航；视线抬到 y=40，让日盘留在上半画幅，下半是云海
  const CR = 64;
  camera.position.set(Math.cos(t * 0.04) * CR, CR, Math.sin(t * 0.04) * CR);
  camera.lookAt(0, 40, 0);

  sunGroup.lookAt(camera.position);

  for (const mat of cloudMats) mat.uniforms.uTime.value = t;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
