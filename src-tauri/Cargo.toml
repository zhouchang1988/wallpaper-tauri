[package]
name = "wallpaper-tauri"
version = "0.1.0"
description = "Tauri live wallpaper app"
authors = ["zhouchang"]
edition = "2021"

[lib]
name = "wallpaper_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
