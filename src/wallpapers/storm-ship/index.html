<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Ship Live Wallpaper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060a12; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(2,4,8,.55) 100%);
  }
  #flash-overlay {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    background: #cfe0ff; opacity: 0; mix-blend-mode: screen;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="flash-overlay"></div>

<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
