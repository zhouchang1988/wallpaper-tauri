<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨夜霓虹壁纸</title>
<!--
  雨夜霓虹动态壁纸 v3 —— 替换原「云海日出」。
  蓝调时刻的十字街谷 + 中央分层塔广场：钴蓝渐变天穹、蓝雾远影，
  三段式楼体逐栋窗格，Reflector 湿地映着天色与霓虹，
  悬挂灯箱 + 湿光拖影，斜风细雨，双向四车道车流。
  遵循项目壁纸约定：
  1. 无任何文字与 UI，只保留纯视觉内容；
  2. 无交互，相机固定 45° 俯视角匀速圆周巡航（相机高度 = 水平半径）；
  3. 复用 src/vendor/three/ 运行时，不重复打包 Three.js。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1c3a; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(4,8,18,.5) 100%);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three/three.module.js",
    "three/addons/": "../../vendor/three/addons/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
